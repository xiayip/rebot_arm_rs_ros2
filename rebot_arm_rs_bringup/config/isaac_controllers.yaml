controller_manager:
  ros__parameters:
    update_rate: 200

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    rebot_arm_rs_isaac_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

rebot_arm_rs_isaac_trajectory_controller:
  ros__parameters:
    joints: [joint1, joint2, joint3, joint4, joint5, joint6]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: true
    interpolate_from_desired_state: true
    constraints:
      stopped_velocity_tolerance: 0.0
      goal_time: 0.0
      # Isaac may lag the commanded spline while physics settles. Disable path
      # and goal aborts here. Convergence can be evaluated from controller_state.
      joint1: {trajectory: 0.0, goal: 0.0}
      joint2: {trajectory: 0.0, goal: 0.0}
      joint3: {trajectory: 0.0, goal: 0.0}
      joint4: {trajectory: 0.0, goal: 0.0}
      joint5: {trajectory: 0.0, goal: 0.0}
      joint6: {trajectory: 0.0, goal: 0.0}
